name: Build Aether Term Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm aether_term.spec
          Compress-Archive -Path "dist/Aether Term" -DestinationPath "dist/Aether_Term_Portable.zip"

      - name: Upload executable to release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/Aether_Term_Portable.zip

name: Build Aether Term Release

on:
  release:
    types: [created]

permissions:
  contents: write   # attach the build to the release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          $version = (Get-Content version.txt).Trim()
          pyinstaller --noconfirm aether_term.spec
          Compress-Archive -Path "dist/Aether Term" -DestinationPath "dist/Aether_Term_Portable_$version.zip"

      - name: Upload portable build to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Aether_Term_Portable_*.zip

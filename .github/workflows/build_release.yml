name: Build Aether Term Release

on:
  # "published", not "created": a release made as a draft first (as
  # `gh release create` does when it uploads files) never fires "created".
  release:
    types: [published]
  # By hand: Actions → Run workflow.  With a tag, build that tag and attach
  # to its release; without one, build the selected branch as a dry run and
  # keep the files as workflow artifacts only.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v1.1.2; created on the selected branch if missing); empty = dry run"
        required: false
        default: ""

permissions:
  contents: write   # attach the build to the release

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0     # with tags, to find the release tag below

      # Build the tag when it exists.  Run by hand for a tag that does not
      # exist yet, build the selected branch and let the release step create
      # the tag on this exact commit.
      - name: Select the commit to build
        if: env.TAG != ''
        run: |
          # "git tag -l" exits 0 either way; it prints the tag only if it exists
          if (git tag -l $env:TAG) {
            git checkout -q "refs/tags/$env:TAG"
            "Building existing tag $env:TAG"
          } else {
            $sha = (git rev-parse HEAD).Trim()
            "TARGET_SHA=$sha" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            "Tag $env:TAG does not exist: building $sha; the release step will create the tag there"
          }

      - name: Check version.txt against the tag
        if: env.TAG != ''
        run: |
          $version = (Get-Content version.txt).Trim()
          if ("v$version" -ne $env:TAG) {
            Write-Error "version.txt says $version but the release tag is $env:TAG"
            exit 1
          }

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build executable, installer and zips
        run: |
          $version = (Get-Content version.txt).Trim()
          pyinstaller --noconfirm --clean aether_term.spec
          if (-not (Test-Path "dist/Aether Term/Aether Term.exe")) { throw "PyInstaller produced no exe" }
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                    "${env:ProgramFiles}\Inno Setup 6\ISCC.exe") |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command iscc -ErrorAction Stop).Source }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $setup = "dist/Aether_Term_Setup_$version.exe"
          if (-not (Test-Path $setup)) { throw "$setup not found" }
          # Same three files as build.bat: installer, zipped installer, portable zip
          Compress-Archive -Path $setup -DestinationPath "dist/Aether_Term_Setup_$version.zip"
          Compress-Archive -Path "dist/Aether Term" -DestinationPath "dist/Aether_Term_Portable_$version.zip"
          Get-ChildItem dist -File | Format-Table Name, Length
          # Release notes: this version's CHANGELOG section
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $start = [array]::FindIndex($lines, [Predicate[string]]{ param($l) $l.StartsWith("## [$version]") })
          if ($start -lt 0) { throw "CHANGELOG.md has no '## [$version]' section" }
          $end = [array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l.StartsWith("## [") })
          if ($end -lt 0) { $end = $lines.Count }
          $lines[($start + 1)..($end - 1)] | Set-Content -Encoding UTF8 dist/RELEASE_NOTES.md
          "Release notes:"; Get-Content dist/RELEASE_NOTES.md
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Keep the build (dry run)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: aether-term-build
          path: |
            dist/RELEASE_NOTES.md
            dist/Aether_Term_Setup_*.exe
            dist/Aether_Term_Setup_*.zip
            dist/Aether_Term_Portable_*.zip

      - name: Attach the build to the release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ env.TARGET_SHA }}
          # Run by hand, this step creates the release when the tag has none:
          # give it a title and this version's CHANGELOG notes.  A release
          # published on GitHub keeps the title and notes written there.
          name: ${{ github.event_name == 'workflow_dispatch' && format('Aether Term {0}', env.VERSION) || '' }}
          body_path: ${{ github.event_name == 'workflow_dispatch' && 'dist/RELEASE_NOTES.md' || '' }}
          files: |
            dist/Aether_Term_Setup_*.exe
            dist/Aether_Term_Setup_*.zip
            dist/Aether_Term_Portable_*.zip
